# =============================================================================
# pytest.ini  -  settings for pytest, read automatically when pytest starts
# =============================================================================
# Lines starting with "#" are comments. "[pytest]" starts pytest's section.
[pytest]

# Look for tests only inside the "tests" folder.
testpaths = tests

# Add the project folder to Python's import search path, so test files can
# write "from simlab.ode_solvers import ..." and "from bugs ...".
pythonpath = .

# Extra options used on every run:
#   -ra        print a short summary of every test that did not pass
#   --strict-markers  treat a misspelled marker name as an error
addopts = -ra --strict-markers
